name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
        include:
          - os: ubuntu-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,dev,http]'
      - name: Lint
        run: |
          ruff check src tests
          black --check src tests
      - name: Type check
        run: mypy src/photo_mcp
      - name: Test (with coverage)
        env:
          OPENAI_API_KEY: dummy-key-not-used-in-cassette-replay
        run: pytest --cov=photo_mcp --cov-report=xml --cov-fail-under=90
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    name: Build distributables
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Build wheel
        run: python -m build --wheel
      - name: Build standalone binary
        run: |
          python -m PyInstaller --onefile --name photo-mcp src/photo_mcp/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: photo-mcp-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/photo-mcp*
