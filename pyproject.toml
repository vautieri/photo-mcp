# =============================================================================
# photo-mcp — production MCP server bridging Claude/ChatGPT to OpenAI gpt-image
# =============================================================================
#
# Runtime: Python 3.12+. Cross-platform: Linux + Windows at v1.0; macOS +30d.
# Source of truth for system design is at docs/05-system-design.md.
# Source of truth for the binding process is docs/10-process-flow.md.
# =============================================================================

[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "photo-mcp"
version         = "0.1.0"
description     = "MCP server for OpenAI gpt-image models with photographer-grade quality preservation"
readme          = "README.md"
requires-python = ">=3.12"
license         = { text = "Proprietary" }
authors         = [
    { name = "photo-mcp contributors" }
]
keywords        = ["mcp", "openai", "gpt-image", "photography"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    "mcp >=1.0,<2.0",
    "openai >=1.50,<2.0",
    "pydantic >=2.5,<3.0",
    "Pillow >=10.4,<12.0",
    "piexif >=1.1.3,<2.0",
    "iptcinfo3 >=2.1,<3.0",
    "rawpy >=0.21,<1.0",
    "scikit-image >=0.22,<1.0",
    "numpy >=1.26,<3.0",
    "httpx >=0.27,<1.0",
    "tomli >=2.0,<3.0; python_version < '3.11'",
    "anyio >=4.0,<5.0",
]

[project.optional-dependencies]
http = [
    "uvicorn >=0.30,<1.0",
    "starlette >=0.37,<1.0",
    "sse-starlette >=2.0,<3.0",
]
xmp = [
    # XMP toolkit is optional — install if XMP round-trip is required.
    # The server gracefully degrades without it (logs a warning at startup).
    "python-xmp-toolkit >=2.0,<3.0",
]
test = [
    "pytest >=8.0,<9.0",
    "pytest-asyncio >=0.24,<1.0",
    "pytest-cov >=5.0,<7.0",
    "pytest-benchmark >=4.0,<6.0",
    "vcrpy >=6.0,<7.0",
    "freezegun >=1.5,<2.0",
]
dev = [
    "mypy >=1.10,<2.0",
    "ruff >=0.6,<1.0",
    "black >=24.0,<26.0",
    "pre-commit >=3.7,<5.0",
    "build >=1.2,<2.0",
    "pyinstaller >=6.0,<7.0",
]

[project.scripts]
photo-mcp = "photo_mcp.main:main"

[project.urls]
"Source"      = "local"
"Bug Tracker" = "local"

# -----------------------------------------------------------------------------
# Tooling configuration
# -----------------------------------------------------------------------------

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where   = ["src"]
include = ["photo_mcp*"]

[tool.setuptools.package-data]
photo_mcp = ["prices.json", "py.typed"]

# -- ruff (lint + format) -----------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
src            = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "TID",  # tidy imports
    "PL",   # pylint subset
    "PT",   # pytest style
    "S",    # bandit security
    "T20",  # disallow stray prints (we use structured logger)
]
ignore = [
    "PLR0913",  # too many args — schemas have many fields by design
    "S101",    # asserts in tests
    "S603",    # subprocess (legitimate for PyInstaller-built binaries)
]
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "PLR2004"]  # tests use literals + don't need bandit

# -- black (format) -----------------------------------------------------------
[tool.black]
line-length    = 100
target-version = ["py312"]

# -- mypy (type-check, --strict) ----------------------------------------------
[tool.mypy]
python_version       = "3.12"
strict               = true
warn_unused_ignores  = true
disallow_any_generics = true
no_implicit_reexport = true
plugins              = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages without type stubs we depend on.
module                 = ["rawpy.*", "iptcinfo3.*", "piexif.*", "vcr.*"]
ignore_missing_imports = true

# -- pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths        = ["tests"]
asyncio_mode     = "auto"
addopts          = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "live_api: integration test that hits the real OpenAI API (skipped unless RUN_LIVE_API=1)",
    "slow: long-running test (skipped unless RUN_SLOW=1)",
    "windows: Windows-specific test",
    "linux: Linux-specific test",
]
filterwarnings = [
    "error",
    # nlohmann/json's deprecation warnings via openai, etc., go here when needed.
]

# -- coverage -----------------------------------------------------------------
[tool.coverage.run]
source = ["src/photo_mcp"]
branch = true

[tool.coverage.report]
fail_under   = 90
show_missing = true
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
]
